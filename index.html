<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png" />

    <link
      rel="stylesheet"
      href="style.css" />

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geomini:wght@200..800&family=Karla:ital,wght@0,200..800;1,200..800&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet" />
    <title>Frontend Mentor | Contact form</title>
  </head>
  <body class="container">
    <main class="contain-main">
      <form
        action=""
        class="contain-form">
        <h1>Contact Us</h1>

        <div class="contain-name">
          <div class="input-format">
            <label for="fName">First Name <span class="astk">*</span></label>
            <input
              type="text"
              id="fName"
              class="input-name" />
          </div>
          <!-- Last Name This field is required -->
          <div class="input-format">
            <label for="LName">Last Name <span class="astk">*</span></label>
            <input
              type="text"
              id="LName"
              class="input-name" />
          </div>
        </div>

        <!-- Email Address -->
        <div class="div-email">
          <label for="email">Email Address <span class="astk">*</span></label>
          <input
            type="email"
            id="email"
            class="input-email" />
        </div>

        <div class="contain-radio-div">
          <label for="">Query types <span class="astk">*</span></label>

          <div class="contain-radio">
            <label
              for="general"
              class="btn-radio">
              <input
                type="radio"
                name="general"
                value="general"
                class="input-radio" />
              <span>General Enquiry</span>
            </label>

            <label
              for="support"
              class="btn-radio">
              <input
                type="radio"
                name="support"
                value="support"
                class="input-radio" />
              <span>Support Request</span>
            </label>
          </div>
        </div>

        <div class="contain-message">
          <label for="sms">Message <span class="astk">*</span></label>
          <textarea
            class="message"
            name="sms">
          </textarea>
        </div>

        <div>
          <input type="checkbox" />
          <span> I consent to being contacted by the team *</span>
        </div>

        <input
          type="button"
          value="Submit"
          class="btn-submit" />
      </form>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by
      <a
        href="https://linkedin.com/in/pedro-mawonso-5352102b0"
        class="profile-link"
        >Pedro Mawonso</a
      >.
    </footer>
  </body>
</html>
